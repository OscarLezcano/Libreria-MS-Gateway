spring.application.name=gateway
server.port=8080

eureka.instance.instance-id=${spring.application.name}:${random.uuid}
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Compras:8081 (descubrimiento dinamico via Eureka)
spring.cloud.gateway.server.webflux.routes[0].id=compras
spring.cloud.gateway.server.webflux.routes[0].uri=lb://purchases-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/**

# Ventas:8082
spring.cloud.gateway.server.webflux.routes[1].id=ventas
spring.cloud.gateway.server.webflux.routes[1].uri=lb://sales-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/sales/**

# Stock:8083
spring.cloud.gateway.server.webflux.routes[2].id=stock
spring.cloud.gateway.server.webflux.routes[2].uri=lb://stock-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/stock/**

# --- Swagger ---
springdoc.swagger-ui.disable-swagger-default-url=true

# Solucion de CORS :3
spring.cloud.gateway.server.webflux.trusted-proxies=.*

spring.cloud.gateway.server.webflux.routes[3].id=docs-compras
spring.cloud.gateway.server.webflux.routes[3].uri=lb://purchases-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/docs/compras
spring.cloud.gateway.server.webflux.routes[3].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.server.webflux.routes[4].id=docs-ventas
spring.cloud.gateway.server.webflux.routes[4].uri=lb://sales-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/docs/ventas
spring.cloud.gateway.server.webflux.routes[4].filters[0]=SetPath=/sales/v3/api-docs

spring.cloud.gateway.server.webflux.routes[5].id=docs-stock
spring.cloud.gateway.server.webflux.routes[5].uri=lb://stock-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/docs/stock
spring.cloud.gateway.server.webflux.routes[5].filters[0]=SetPath=/stock/v3/api-docs

# Dropdown de Swagger UI con los 3 servicios
springdoc.swagger-ui.urls[0].name=Compras
springdoc.swagger-ui.urls[0].url=/docs/compras
springdoc.swagger-ui.urls[1].name=Ventas
springdoc.swagger-ui.urls[1].url=/docs/ventas
springdoc.swagger-ui.urls[2].name=Stock
springdoc.swagger-ui.urls[2].url=/docs/stock
